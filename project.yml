name: Interpres
options:
  bundleIdPrefix: dev.interpres
  deploymentTarget:
    iOS: "17.0"
targets:
  Interpres:
    type: application
    platform: iOS
    sources:
      - ios/Interpres
      - ios/InterpresJITHelper/InterpresJITMessages.swift
    info:
      path: ios/Info.plist
      properties:
        CFBundleDisplayName: Interpres
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.interpres.app
            CFBundleURLSchemes:
              - interpres
        LSApplicationQueriesSchemes:
          - stikjit
          - sidestore
          - apple-magnifier
          - localdevvpn
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.interpres.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - target: InterpresJITHelper
      - target: StikJIT
        embed: true

  InterpresJITHelper:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ios/InterpresJITHelper
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.interpres.app.JITHelper
        INFOPLIST_FILE: ios/InterpresJITHelper/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../../Frameworks"
    dependencies:
      - target: StikJIT
        embed: false

  StikJIT:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: deps/StikJIT/Sources
      - path: deps/StikJIT/Scripts
        buildPhase: resources
    dependencies:
      - sdk: JavaScriptCore.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: CFNetwork.framework
      - sdk: SystemConfiguration.framework
      - sdk: IOKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.interpres.app.StikJIT
        PRODUCT_NAME: StikJIT
        DEFINES_MODULE: YES
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/deps/StikJIT/idevice $(SRCROOT)/deps/StikJIT/iokit"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/deps/StikJIT/idevice $(SRCROOT)/deps/StikJIT/iokit"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/deps/StikJIT/idevice"
        OTHER_LDFLAGS: "$(inherited) -Wl,-hidden-lidevice_ffi"

schemes:
  Interpres:
    build:
      targets:
        Interpres: all
        InterpresJITHelper: all
        StikJIT: all
